<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Sunrise Coffee Performance Review banner">
  <defs>
    <clipPath id="cupClip"><path d="M70 90 H150 L142 168 Q140 182 126 182 H94 Q80 182 78 168 Z"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5EBDD"/><stop offset="1" stop-color="#E6D5B8"/>
    </linearGradient>
  </defs>
  <style>
    .steam{fill:none;stroke:#6F4E37;stroke-width:5;stroke-linecap:round;opacity:0;animation:rise 3s ease-in-out infinite}
    .s2{animation-delay:.9s}.s3{animation-delay:1.8s}
    @keyframes rise{0%{opacity:0;transform:translateY(14px)}35%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
    .fill{animation:fillup 4s ease-in-out infinite alternate}
    @keyframes fillup{0%{transform:translateY(60px)}100%{transform:translateY(0)}}
    .fade{animation:in 1.4s ease-out .3s backwards}
    .fade2{animation:in 1.4s ease-out .9s backwards}
    @keyframes in{from{opacity:0}}
  </style>
  <rect width="1000" height="240" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="14" height="240" rx="7" fill="#6F4E37"/>
  <!-- steam -->
  <path class="steam"    d="M92 78 q-8 -12 0 -24 q8 -12 0 -24"/>
  <path class="steam s2" d="M110 78 q-8 -12 0 -24 q8 -12 0 -24"/>
  <path class="steam s3" d="M128 78 q-8 -12 0 -24 q8 -12 0 -24"/>
  <!-- cup -->
  <g clip-path="url(#cupClip)">
    <rect x="60" y="90" width="100" height="95" fill="#FBF5EA"/>
    <g class="fill"><rect x="60" y="118" width="100" height="70" fill="#6F4E37"/></g>
  </g>
  <path d="M70 90 H150 L142 168 Q140 182 126 182 H94 Q80 182 78 168 Z" fill="none" stroke="#3B2418" stroke-width="5" stroke-linejoin="round"/>
  <path d="M150 104 q30 0 26 28 q-4 22 -30 22" fill="none" stroke="#3B2418" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="110" cy="190" rx="52" ry="6" fill="#C68B59" opacity=".6"/>
  <!-- text -->
  <text class="fade" x="215" y="105" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#34231E">Sunrise <tspan fill="#7A4A2E">Coffee</tspan></text>
  <text class="fade" x="215" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#34231E">Performance Review</text>
  <text class="fade2" x="217" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#6B5547">60 UK stores · 2023-2024 · where the profit comes from and where it leaks</text>
  <text class="fade2" x="217" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#B5533C">#DataDNA · Power BI · DAX</text>
</svg>
